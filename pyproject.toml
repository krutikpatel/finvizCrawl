[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finzwiz"
version = "0.1.0"
description = "Single-ticker Finviz scraper for LLM-ready JSON artifacts"
readme = "PRD.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "python-dateutil>=2.9.0",
  "PyYAML>=6.0.0",
  "readability-lxml>=0.8.1",
  "requests>=2.31.0",
  "trafilatura>=1.8.0",
]

[project.scripts]
finzwiz = "finzwiz.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

